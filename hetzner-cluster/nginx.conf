# ====================================================================
# ADUBIBLE / ELOHIM BIBLE HUB — NGINX HIGH-CONCURRENCY REVERSE PROXY
# Tuned for Hetzner Bare Metal (AMD Ryzen / EPYC)
# Target: 4 Billion Planetary Readers (Behind Cloudflare Edge)
# ====================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Throughput Buffers & Timeouts
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 5;

    # File Descriptor Cache
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Node.js Cluster
    upstream origin_cluster {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # Microcache Zone for Scripture Chapters (100MB key zone, 500MB inactive storage)
    proxy_cache_path /var/cache/nginx/scripture levels=1:2 keys_zone=SCRIPTURE_CACHE:100m inactive=24h max_size=1g use_temp_path=off;

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Healthcheck endpoint (Bypasses cache)
        location /healthz {
            proxy_pass http://origin_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Scripture Chapters with Nginx Microcache
        location /api/v1/chapters/ {
            proxy_pass http://origin_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Nginx Caching Rules
            proxy_cache SCRIPTURE_CACHE;
            proxy_cache_valid 200 302 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            add_header X-Nginx-Cache $upstream_cache_status;
        }

        # Dynamic Search & Other API Routes
        location / {
            proxy_pass http://origin_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
