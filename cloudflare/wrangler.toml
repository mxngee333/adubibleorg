name = "adubible-edge-worker"
main = "worker.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "2beae38bec708c3da9dee9f12c68cad8"

# Cloudflare Global Network Placement (Runs at all 330+ Edge PoPs)
[placement]
mode = "smart"

# Environment Variables
[vars]
ENVIRONMENT = "production"
HETZNER_ORIGIN_URL = "https://origin.adubible.org"
ALLOWED_ORIGINS = "https://adubible.org,https://elohimbible.web.app,https://elohimbible.firebaseapp.com,https://adubibleorg.web.app,https://adubibleorg.firebaseapp.com"

# Cloudflare R2 Bucket Binding (Zero Egress Scripture & Audio Vault)
[[r2_buckets]]
binding = "SCRIPTURE_BUCKET"
bucket_name = "adubible"

# Cloudflare D1 Distributed Edge Database
[[d1_databases]]
binding = "DB"
database_name = "adubible-edge-db"
database_id = "adubible-d1-placeholder-id"
