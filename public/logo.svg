<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3b1368" />
      <stop offset="60%" stop-color="#18072b" />
      <stop offset="100%" stop-color="#090212" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Page Shadow -->
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Radiance Aura Behind Book -->
  <circle cx="256" cy="205" r="130" fill="#f59e0b" opacity="0.12" filter="blur(30px)" />

  <!-- Open Bible Symbol -->
  <g filter="url(#pageShadow)" transform="translate(116, 100)">
    <!-- Book Spine & Binding Backing -->
    <path d="M 140 168 Q 140 185 140 195" stroke="#78350f" stroke-width="8" stroke-linecap="round" />

    <!-- Left Book Cover / Outer Page -->
    <path d="M 140 178 C 95 162 40 165 10 178 L 10 50 C 45 36 95 34 140 48 Z" fill="#2d104e" stroke="url(#goldSheen)" stroke-width="3.5" />

    <!-- Left Open Leaf -->
    <path d="M 136 170 C 95 156 46 158 18 170 L 18 44 C 48 32 94 30 136 43 Z" fill="#faf5ff" />

    <!-- Left Page Ruling Lines -->
    <line x1="38" y1="68" x2="116" y2="60" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="38" y1="88" x2="116" y2="80" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="38" y1="108" x2="116" y2="100" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="38" y1="128" x2="116" y2="120" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="38" y1="148" x2="96" y2="142" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Right Book Cover / Outer Page -->
    <path d="M 140 178 C 185 162 240 165 270 178 L 270 50 C 235 36 185 34 140 48 Z" fill="#2d104e" stroke="url(#goldSheen)" stroke-width="3.5" />

    <!-- Right Open Leaf -->
    <path d="M 144 170 C 185 156 234 158 262 170 L 262 44 C 232 32 186 30 144 43 Z" fill="#fefce8" />

    <!-- Right Page Ruling Lines -->
    <line x1="164" y1="60" x2="242" y2="68" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="164" y1="80" x2="242" y2="88" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="164" y1="100" x2="242" y2="108" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="164" y1="120" x2="242" y2="128" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="164" y1="140" x2="222" y2="146" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Book Center Seam & Ribbon Bookmark -->
    <path d="M 140 46 L 140 176" stroke="#78350f" stroke-width="4" />
    <path d="M 140 174 Q 146 195 152 208 L 140 200 L 128 208 Q 134 195 140 174 Z" fill="url(#goldLeaf)" stroke="#78350f" stroke-width="1.5" />

    <!-- Center Top Cross Emblem -->
    <g transform="translate(140, 36) scale(0.9)">
      <circle cx="0" cy="0" r="14" fill="#1e0a38" stroke="url(#goldSheen)" stroke-width="2" />
      <path d="M 0 -8 L 0 8 M -6 -2 L 6 -2" stroke="url(#goldSheen)" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography: AduBible Wordmark -->
  <text x="256" y="380" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="1">
    <tspan fill="url(#goldSheen)">Adu</tspan><tspan fill="#f8fafc">Bible</tspan>
  </text>

  <!-- Subtitle: Parallel Study Sanctuary -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1" letter-spacing="4">
    PARALLEL SCRIPTURE SANCTUARY
  </text>

  <!-- Bottom Dedicated Crest -->
  <text x="256" y="448" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a855f7" letter-spacing="2">
    ADUBIBLE.ORG • 100% AD-FREE
  </text>
</svg>
